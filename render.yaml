# Render Blueprint — деплой подключением репозитория (https://render.com/docs/blueprint-spec)
services:
  - type: web
    name: legal-constructor
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true       # Render сгенерирует случайный секрет
      - key: OPENAI_BASE_URL
        value: "https://openrouter.ai/api/v1"
      - key: OPENAI_MODEL
        value: "nvidia/nemotron-nano-12b-v2-vl:free"
      # Ключ OpenRouter НЕ хранится в git — вписать вручную в дашборде Render.
      - key: OPENAI_API_KEY
        sync: false
