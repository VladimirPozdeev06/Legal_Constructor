{% load static %}
<div
    class="ai-widget"
    id="aiWidget"
    data-search-url="{% url 'core:ai_search_documents' %}"
    data-ask-url="{% url 'core:ai_ask_llm' %}"
    data-quota-url="{% url 'core:ai_quota' %}"
    data-home-url="{% url 'core:home' %}"
    data-login-url="{% url 'accounts:login' %}"
    data-register-url="{% url 'accounts:register' %}"
    data-cabinet-url="{% url 'core:cabinet' %}"
    data-authenticated="{% if user.is_authenticated %}1{% else %}0{% endif %}"
>
    <div class="ai-panel" id="aiPanel" aria-hidden="true">
        <div class="ai-panel-header">
            <strong class="ai-panel-title">
                <img src="{% static 'icons/ic-ai.svg' %}" alt="" class="ai-panel-title-icon">
                AI-помощник
            </strong>
            <button type="button" class="ai-close" id="aiCloseBtn" aria-label="Закрыть">✕</button>
        </div>
        <p class="ai-disclaimer">Не является полноценной заменой юриста</p>

        <div class="ai-panel-body">
            <div class="ai-ask-screen" id="aiScreenAsk">
                <div id="aiAskTranscript" class="ai-messages"></div>
                <div class="ai-ask-footer">
                    <div class="ai-input-row">
                        <input id="aiAskInput" class="ai-textarea ai-text-input" placeholder="Мне нужно..." autocomplete="off">
                        <button type="button" class="ai-primary-btn ai-send-btn" id="aiAskSubmit" aria-label="Отправить">→</button>
                    </div>
                    <div class="ai-quota-strip" id="aiQuotaStrip" aria-live="polite"></div>
                    <div class="ai-disclaimer-foot" id="aiInputDisclaimer">
                        Примечание: ответ AI не заменяет юридическую консультацию.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="ai-fab" id="aiFab" type="button" aria-label="Открыть AI-помощника">
        <img src="{% static 'icons/ic-ai-fab.svg' %}" alt="" class="ai-fab-icon">
    </button>
</div>

<div class="ai-auth-modal" id="aiAuthModal" role="dialog" aria-modal="true" aria-labelledby="aiAuthTitle">
    <div class="ai-auth-box">
        <p id="aiAuthTitle">Чтобы заполнить документ, войдите или зарегистрируйтесь.</p>
        <div class="ai-auth-actions">
            <a class="primary" id="aiAuthLogin" href="{% url 'accounts:login' %}">Войти</a>
            <a class="secondary" href="{% url 'accounts:register' %}">Регистрация</a>
        </div>
        <button type="button" class="ai-back" id="aiAuthClose" style="margin-top:12px">Закрыть</button>
    </div>
</div>

<style>
    .ai-hidden { display: none !important; }
    .ai-bubble {
        max-width: 82%;
        border: 1px solid #7f1237;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 18px;
        margin-bottom: 4px;
        line-height: 1.3;
        color: #16344f;
    }
    .ai-bubble-user {
        background: #f9f7f5;
        margin-left: auto;
    }
    .ai-bubble-bot {
        background: #f9f7f5;
    }
    .ai-time-label {
        margin: 0 0 12px;
        font-size: 16px;
        color: #56061d;
        line-height: 1;
    }
    .ai-time-label.right {
        text-align: right;
    }
    .ai-disclaimer-inline {
        margin: 6px 0 10px;
        padding: 8px 10px;
        font-size: 12px;
        line-height: 1.35;
        color: #46627b;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(198, 180, 172, 0.45);
        border-radius: 8px;
    }
    .ai-send-btn.ai-send-btn--active {
        background: #56061d !important;
        color: #f3f0ea !important;
        border-color: #56061d !important;
    }
    .ai-pricing-link {
        color: #56061d;
        font-weight: 600;
        text-decoration: underline;
    }
    .ai-quota-strip {
        margin: 2px 0 0;
        padding: 6px 10px;
        font-size: 13px;
        line-height: 1.35;
        font-weight: 500;
        color: #022e4c;
        text-align: center;
        background: rgba(249, 247, 245, 0.75);
        border: 1px solid rgba(86, 6, 29, 0.12);
        border-radius: 8px;
    }
    .ai-quota-strip:empty {
        display: none;
    }
    .ai-thinking {
        color: #16344f;
        font-style: italic;
        animation: ai-thinking-pulse 1.1s ease-in-out infinite;
    }
    @keyframes ai-thinking-pulse {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.9; }
    }
</style>

<script>
    (function () {
        const root = document.getElementById("aiWidget");
        const panel = document.getElementById("aiPanel");
        const fab = document.getElementById("aiFab");
        const closeBtn = document.getElementById("aiCloseBtn");
        const authModal = document.getElementById("aiAuthModal");
        const authLogin = document.getElementById("aiAuthLogin");
        const authClose = document.getElementById("aiAuthClose");
        if (!root || !panel || !fab) return;

        const cfg = {
            searchUrl: root.dataset.searchUrl,
            askUrl: root.dataset.askUrl,
            quotaUrl: root.dataset.quotaUrl,
            homeUrl: root.dataset.homeUrl,
            loginUrl: root.dataset.loginUrl,
            registerUrl: root.dataset.registerUrl,
            cabinetUrl: root.dataset.cabinetUrl,
            isAuth: root.dataset.authenticated === "1",
        };

        const askTranscript = document.getElementById("aiAskTranscript");
        const askInput = document.getElementById("aiAskInput");
        const askSubmit = document.getElementById("aiAskSubmit");
        const quotaStrip = document.getElementById("aiQuotaStrip");
        const getCsrf = () => window.CSRF_TOKEN || "";

        let quotaState = null;

        async function refreshQuota() {
            if (!cfg.quotaUrl) return;
            try {
                const r = await fetch(cfg.quotaUrl, { credentials: "same-origin" });
                quotaState = await r.json();
            } catch {
                quotaState = null;
            }
            renderQuotaStrip();
        }

        function renderQuotaStrip() {
            if (!quotaStrip) return;
            if (!quotaState) {
                quotaStrip.textContent = "";
                return;
            }
            const lim = quotaState.limit;
            const rem = quotaState.remaining;
            const used = quotaState.used;
            if (cfg.isAuth) {
                quotaStrip.textContent = `Доступно ${rem} из ${lim} запросов к AI (использовано ${used}).`;
            } else {
                quotaStrip.textContent = `Без входа в аккаунт: осталось ${rem} из ${lim} запроса.`;
            }
        }

        function syncSendBtn() {
            if (!askSubmit || !askInput) return;
            const has = (askInput.value || "").trim().length > 0;
            askSubmit.classList.toggle("ai-send-btn--active", has);
        }

        function updateAskAvailability() {
            if (!askSubmit) return;
            const rem = quotaState != null ? quotaState.remaining : cfg.isAuth ? 15 : 1;
            askSubmit.disabled = rem <= 0;
        }

        async function resetWidgetOnClose() {
            if (askInput) askInput.value = "";
            if (askTranscript) askTranscript.innerHTML = "";
            await refreshQuota();
            seedMessages();
            updateAskAvailability();
            syncSendBtn();
        }

        async function openPanel() {
            panel.classList.add("is-open");
            panel.setAttribute("aria-hidden", "false");
            fab.classList.add("ai-hidden");
            await refreshQuota();
            seedMessages();
            updateAskAvailability();
            syncSendBtn();
        }

        async function closePanel() {
            panel.classList.remove("is-open");
            panel.setAttribute("aria-hidden", "true");
            fab.classList.remove("ai-hidden");
            await resetWidgetOnClose();
        }

        fab.addEventListener("click", function () {
            if (panel.classList.contains("is-open")) void closePanel();
            else void openPanel();
        });
        closeBtn?.addEventListener("click", function () {
            void closePanel();
        });

        function bubble(html, cls, isRight) {
            const d = document.createElement("div");
            d.className = "ai-bubble " + cls;
            d.innerHTML = html;
            const wrap = document.createElement("div");
            wrap.appendChild(d);
            const tm = document.createElement("p");
            tm.className = "ai-time-label" + (isRight ? " right" : "");
            tm.textContent = "сейчас";
            wrap.appendChild(tm);
            return wrap;
        }

        function openAuthModal(nextUrl) {
            if (authLogin) authLogin.href = cfg.loginUrl + "?next=" + encodeURIComponent(nextUrl || cfg.cabinetUrl);
            if (authModal) authModal.classList.add("is-open");
        }
        authClose?.addEventListener("click", function () {
            authModal?.classList.remove("is-open");
        });
        authModal?.addEventListener("click", function (e) {
            if (e.target === authModal) authModal.classList.remove("is-open");
        });

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;");
        }

        function appendSuggestions(data) {
            if (!askTranscript || !data) return;
            const templates = Array.isArray(data.templates) ? data.templates : [];
            const docs = Array.isArray(data.my_documents) ? data.my_documents : [];
            if (!templates.length && !docs.length) return;

            const wrap = document.createElement("div");
            wrap.style.margin = "0 0 14px";

            if (templates.length) {
                const ttl = document.createElement("p");
                ttl.className = "ai-time-label";
                ttl.style.marginBottom = "8px";
                ttl.textContent = "Шаблоны";
                wrap.appendChild(ttl);
                templates.forEach((item) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "ai-primary-btn";
                    btn.style.width = "100%";
                    btn.style.marginBottom = "8px";
                    btn.style.textTransform = "none";
                    btn.style.fontSize = "14px";
                    btn.textContent = item.name;
                    btn.addEventListener("click", () => {
                        const target = item.start_url || item.startUrl;
                        if (!target) return;
                        window.location.href = target;
                    });
                    wrap.appendChild(btn);
                });
            }

            if (docs.length) {
                const ttl = document.createElement("p");
                ttl.className = "ai-time-label";
                ttl.style.marginBottom = "8px";
                ttl.textContent = "Мои документы";
                wrap.appendChild(ttl);
                docs.slice(0, 8).forEach((item) => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "ai-primary-btn";
                    btn.style.width = "100%";
                    btn.style.marginBottom = "8px";
                    btn.style.textTransform = "none";
                    btn.style.fontSize = "14px";
                    btn.textContent = (item.name || "Документ") + (item.updated_at ? " (" + item.updated_at + ")" : "");
                    btn.addEventListener("click", () => {
                        const target = item.open_url || item.openUrl;
                        if (!target) return;
                        window.location.href = target;
                    });
                    wrap.appendChild(btn);
                });
            }

            askTranscript.appendChild(wrap);
        }

        function seedMessages() {
            if (!askTranscript) return;
            askTranscript.innerHTML = "";
            askTranscript.appendChild(
                bubble(
                    "Чем я могу помочь<br>1. Подберу документ<br>2. Помогу с юридическими вопросами",
                    "ai-bubble-bot",
                    false
                )
            );
            askTranscript.appendChild(bubble("Мне нужно", "ai-bubble-user", true));
        }

        askSubmit?.addEventListener("click", async function () {
            const q = (askInput?.value || "").trim();
            if (!q) return;
            await refreshQuota();
            const rem = quotaState != null ? quotaState.remaining : 0;
            if (rem <= 0) return;
            askSubmit.disabled = true;
            askTranscript.appendChild(bubble(escapeHtml(q).replace(/\n/g, "<br>"), "ai-bubble-user", true));
            askInput.value = "";
            syncSendBtn();
            const thinkingEl = document.createElement("div");
            thinkingEl.className = "ai-bubble ai-bubble-bot ai-thinking";
            thinkingEl.textContent = "Думаю над ответом…";
            askTranscript.appendChild(thinkingEl);
            askTranscript.scrollTop = askTranscript.scrollHeight;

            // Бесплатная модель/хостинг могут отвечать долго (холодный старт после простоя).
            // Подбадриваем пользователя и страхуемся таймаутом, чтобы спиннер не висел вечно.
            const controller = new AbortController();
            const slowTimer = setTimeout(function () {
                thinkingEl.textContent = "Бесплатный AI отвечает дольше обычного, ещё думаю…";
            }, 7000);
            const abortTimer = setTimeout(function () { controller.abort(); }, 45000);
            try {
                const askRes = await fetch(cfg.askUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "X-CSRFToken": getCsrf() },
                    body: JSON.stringify({ question: q }),
                    signal: controller.signal,
                });
                const data = await askRes.json().catch(() => ({}));
                clearTimeout(slowTimer);
                clearTimeout(abortTimer);
                thinkingEl.remove();
                if (data.quota) {
                    quotaState = data.quota;
                    renderQuotaStrip();
                }
                const ans =
                    data.answer ||
                    "В данный момент сервис недоступен. Попробуйте позже или воспользуйтесь подбором шаблона в разделе «Шаблоны».";
                askTranscript.appendChild(bubble(escapeHtml(ans).replace(/\n/g, "<br>"), "ai-bubble-bot", false));
                // Документы берём из ответа LLM (синхронизированы с тем, что видел LLM)
                if ((data.suggested_docs && data.suggested_docs.length) || (data.my_documents && data.my_documents.length)) {
                    appendSuggestions({ templates: data.suggested_docs || [], my_documents: data.my_documents || [] });
                }
                if (data.quota_warning) {
                    const w = document.createElement("div");
                    w.className = "ai-disclaimer-inline";
                    w.style.borderColor = "rgba(86, 6, 29, 0.35)";
                    w.style.color = "#56061d";
                    w.textContent = data.quota_warning;
                    askTranscript.appendChild(w);
                }
                if (data.limited && !cfg.isAuth) {
                    const wrap = document.createElement("div");
                    wrap.className = "ai-disclaimer-inline";
                    wrap.innerHTML =
                        escapeHtml("Лимит исчерпан. Чтобы продолжить, выберите тариф: ") +
                        '<a class="ai-pricing-link" href="' +
                        escapeHtml(cfg.homeUrl) +
                        '#pricing">перейти к тарифам</a>.';
                    askTranscript.appendChild(wrap);
                }
            } catch (err) {
                clearTimeout(slowTimer);
                clearTimeout(abortTimer);
                thinkingEl.remove();
                const timedOut = err && err.name === "AbortError";
                askTranscript.appendChild(
                    bubble(
                        escapeHtml(
                            timedOut
                                ? "Сервис не ответил вовремя — возможно, бесплатный хостинг «просыпается» после простоя. Подождите минуту и отправьте вопрос ещё раз."
                                : "В данный момент сервис недоступен. Попробуйте позже или воспользуйтесь подбором шаблона в разделе «Шаблоны»."
                        ),
                        "ai-bubble-bot",
                        false
                    )
                );
                await refreshQuota();
            }
            updateAskAvailability();
            if (!cfg.isAuth && quotaState && quotaState.remaining <= 0) {
                const wrap = document.createElement("div");
                wrap.className = "ai-disclaimer-inline";
                wrap.innerHTML =
                    escapeHtml("Бесплатные запросы закончились. Для продолжения оформите тариф: ") +
                    '<a class="ai-pricing-link" href="' +
                    escapeHtml(cfg.homeUrl) +
                    '#pricing">тарифы на главной</a>.';
                askTranscript.appendChild(wrap);
            }
            askTranscript.scrollTop = askTranscript.scrollHeight;
        });

        askInput?.addEventListener("input", syncSendBtn);
        askInput?.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                askSubmit?.click();
            }
        });

        document.getElementById("homeAiOpen")?.addEventListener("click", function () {
            void openPanel();
        });

        window.openAiAssistant = function () {
            void openPanel();
        };

        panel.classList.remove("is-open");
        void resetWidgetOnClose();
    })();
</script>
